spring:
  application:
    name: task-service-app

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/task-realm

  datasource:
    url: jdbc:postgresql://localhost:5433/task_postgres
    username: task
    password: task
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


server:
  port: 8082
